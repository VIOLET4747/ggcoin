<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ggcoin - 区块链可视化管理界面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-tabs {
            display: flex;
            gap: 1rem;
        }
        
        .nav-tabs button {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-tabs button:hover, .nav-tabs button.active {
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border-color: transparent;
            color: #000;
        }
        
        .container {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-card .number {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .stat-card .label {
            color: #888;
            margin-top: 0.5rem;
        }
        
        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .btn {
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            border: none;
            color: #000;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
        }
        
        .btn-danger {
            background: linear-gradient(90deg, #ff4757, #ff6b81);
        }
        
        .btn-danger:hover {
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .block-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .block-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .block-item:hover {
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
        }
        
        .block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .block-index {
            font-weight: bold;
            color: #00ff88;
        }
        
        .block-hash {
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
        }
        
        .block-details {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: #aaa;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00ff88;
        }
        
        .wallet-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .wallet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        
        .wallet-name {
            font-weight: bold;
        }
        
        .wallet-balance {
            color: #00ff88;
            font-weight: bold;
        }
        
        .wallet-address {
            font-family: monospace;
            font-size: 0.8rem;
            color: #888;
            word-break: break-all;
        }
        
        .peer-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .close-modal {
            cursor: pointer;
            font-size: 1.5rem;
            color: #888;
        }
        
        .close-modal:hover {
            color: #fff;
        }
        
        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 1rem 2rem;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            z-index: 1001;
            animation: slideIn 0.3s ease;
        }
        
        .notification.success {
            background: linear-gradient(90deg, #00ff88, #00d4ff);
            color: #000;
        }
        
        .notification.error {
            background: linear-gradient(90deg, #ff4757, #ff6b81);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .mining-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .mining-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 1s infinite;
        }
        
        .mining-dot.active {
            background: #00ff88;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .pending-tx {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.5rem;
            font-family: monospace;
            font-size: 0.85rem;
        }
        
        .tx-id {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>ggcoin 🪙</h1>
        <div class="nav-tabs">
            <button class="active" onclick="showTab('overview')">区块链概览</button>
            <button onclick="showTab('wallets')">钱包管理</button>
            <button onclick="showTab('transactions')">交易管理</button>
            <button onclick="showTab('mining')">挖矿控制</button>
            <button onclick="showTab('network')">P2P 网络</button>
        </div>
    </div>

    <div class="container">
        <!-- 概览页面 -->
        <div id="overview" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="chain-length">0</div>
                    <div class="label">区块高度</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="pending-count">0</div>
                    <div class="label">待处理交易</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="peer-count">0</div>
                    <div class="label">连接节点</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="total-supply">0</div>
                    <div class="label">总供应量</div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-title">区块链</span>
                    <button class="btn" onclick="refreshBlockchain()">刷新</button>
                </div>
                <div class="block-list" id="block-list"></div>
            </div>
        </div>

        <!-- 钱包页面 -->
        <div id="wallets" class="tab-content" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">钱包列表</span>
                    <button class="btn" onclick="showCreateWalletModal()">创建钱包</button>
                </div>
                <div id="wallet-list"></div>
            </div>
        </div>

        <!-- 交易页面 -->
        <div id="transactions" class="tab-content" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">创建交易</span>
                </div>
                <div class="form-group">
                    <label>发送方地址</label>
                    <select id="tx-from">
                        <option value="">选择钱包</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>接收方地址</label>
                    <input type="text" id="tx-to" placeholder="输入接收地址">
                </div>
                <div class="form-group">
                    <label>金额</label>
                    <input type="number" id="tx-amount" placeholder="输入金额">
                </div>
                <button class="btn" onclick="createTransaction()">发送交易</button>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-title">待处理交易</span>
                    <button class="btn" onclick="refreshPendingTransactions()">刷新</button>
                </div>
                <div id="pending-transactions"></div>
            </div>
        </div>

        <!-- 挖矿页面 -->
        <div id="mining" class="tab-content" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">挖矿控制</span>
                    <div class="mining-indicator">
                        <div class="mining-dot" id="mining-status"></div>
                        <span id="mining-text">未挖矿</span>
                    </div>
                </div>
                <button class="btn" id="mining-btn" onclick="toggleMining()">开始挖矿</button>
                <p style="margin-top: 1rem; color: #888;">
                    挖矿难度: <span id="difficulty">2</span>
                </p>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-title">快速挖矿</span>
                </div>
                <button class="btn" onclick="mineSingleBlock()">挖一个区块</button>
                <p style="margin-top: 1rem; color: #888;">挖一个区块并立即添加到链上</p>
            </div>
        </div>

        <!-- 网络页面 -->
        <div id="network" class="tab-content" style="display: none;">
            <div class="section">
                <div class="section-header">
                    <span class="section-title">网络状态</span>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="number" id="network-status">已停止</div>
                        <div class="label">状态</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="network-port">0</div>
                        <div class="label">监听端口</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="network-peers">0</div>
                        <div class="label">连接节点</div>
                    </div>
                </div>
                <button class="btn" id="network-btn" onclick="toggleNetwork()">启动网络</button>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-title">连接节点</span>
                </div>
                <div class="form-group">
                    <label>节点地址</label>
                    <input type="text" id="peer-host" placeholder="IP 地址">
                </div>
                <div class="form-group">
                    <label>端口</label>
                    <input type="number" id="peer-port" placeholder="端口号">
                </div>
                <button class="btn" onclick="connectPeer()">连接</button>
            </div>

            <div class="section">
                <div class="section-header">
                    <span class="section-title">已连接节点</span>
                </div>
                <div id="peer-list"></div>
            </div>
        </div>
    </div>

    <!-- 创建钱包弹窗 -->
    <div class="modal" id="create-wallet-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>创建新钱包</h2>
                <span class="close-modal" onclick="closeCreateWalletModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>钱包名称</label>
                <input type="text" id="wallet-name" placeholder="输入钱包名称">
            </div>
            <button class="btn" onclick="createWallet()">创建</button>
        </div>
    </div>

    <!-- 通知 -->
    <div class="notification" id="notification" style="display: none;"></div>

    <script>
        function showTab(tab) {
            document.querySelectorAll('.nav-tabs button').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.nav-tabs button[onclick="showTab('${tab}')"]`).classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type}`;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        async function refreshBlockchain() {
            const response = await fetch('/api/blockchain');
            const data = await response.json();
            
            document.getElementById('chain-length').textContent = data.length;
            
            const blockList = document.getElementById('block-list');
            blockList.innerHTML = '';
            
            data.chain.reverse().forEach(block => {
                const blockItem = document.createElement('div');
                blockItem.className = 'block-item';
                blockItem.innerHTML = `
                    <div class="block-header">
                        <span class="block-index">#${block.index}</span>
                        <span class="block-hash">${block.hash}</span>
                    </div>
                    <div class="block-details">
                        <span>交易数: ${block.transaction_count}</span>
                        <span>Nonce: ${block.nonce}</span>
                        <span>时间戳: ${new Date(block.timestamp * 1000).toLocaleString()}</span>
                    </div>
                `;
                blockList.appendChild(blockItem);
            });
        }

        async function refreshWallets() {
            const response = await fetch('/api/wallets');
            const wallets = await response.json();
            
            const walletList = document.getElementById('wallet-list');
            walletList.innerHTML = '';
            
            const select = document.getElementById('tx-from');
            select.innerHTML = '<option value="">选择钱包</option>';
            
            wallets.forEach(wallet => {
                const walletCard = document.createElement('div');
                walletCard.className = 'wallet-card';
                walletCard.innerHTML = `
                    <div class="wallet-header">
                        <span class="wallet-name">${wallet.name}</span>
                        <span class="wallet-balance">${wallet.balance} GGC</span>
                    </div>
                    <div class="wallet-address">${wallet.address}</div>
                `;
                walletList.appendChild(walletCard);
                
                const option = document.createElement('option');
                option.value = wallet.address;
                option.textContent = `${wallet.name} (${wallet.balance} GGC)`;
                select.appendChild(option);
            });
        }

        async function refreshPendingTransactions() {
            const response = await fetch('/api/pending_transactions');
            const transactions = await response.json();
            
            document.getElementById('pending-count').textContent = transactions.length;
            
            const pendingList = document.getElementById('pending-transactions');
            pendingList.innerHTML = '';
            
            if (transactions.length === 0) {
                pendingList.innerHTML = '<p style="color: #888; text-align: center;">暂无待处理交易</p>';
                return;
            }
            
            transactions.forEach(tx => {
                const txItem = document.createElement('div');
                txItem.className = 'pending-tx';
                txItem.innerHTML = `<span class="tx-id">${tx.txid}</span>`;
                pendingList.appendChild(txItem);
            });
        }

        async function refreshNetworkStatus() {
            const response = await fetch('/api/network');
            const data = await response.json();
            
            document.getElementById('network-status').textContent = data.running ? '运行中' : '已停止';
            document.getElementById('network-port').textContent = data.port || 0;
            document.getElementById('network-peers').textContent = data.peer_count || 0;
            document.getElementById('peer-count').textContent = data.peer_count || 0;
            
            const peerList = document.getElementById('peer-list');
            peerList.innerHTML = '';
            
            if (data.peers) {
                data.peers.forEach(peer => {
                    const peerItem = document.createElement('div');
                    peerItem.className = 'peer-item';
                    peerItem.innerHTML = `
                        <span>${peer.host}:${peer.port}</span>
                    `;
                    peerList.appendChild(peerItem);
                });
            }
        }

        async function refreshMiningStatus() {
            const response = await fetch('/api/mining_status');
            const data = await response.json();
            
            const miningDot = document.getElementById('mining-status');
            const miningText = document.getElementById('mining-text');
            const miningBtn = document.getElementById('mining-btn');
            
            if (data.is_mining) {
                miningDot.classList.add('active');
                miningText.textContent = '挖矿中...';
                miningBtn.textContent = '停止挖矿';
                miningBtn.className = 'btn btn-danger';
            } else {
                miningDot.classList.remove('active');
                miningText.textContent = '未挖矿';
                miningBtn.textContent = '开始挖矿';
                miningBtn.className = 'btn';
            }
        }

        async function createTransaction() {
            const from = document.getElementById('tx-from').value;
            const to = document.getElementById('tx-to').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            
            if (!from || !to || isNaN(amount)) {
                showNotification('请填写完整信息', 'error');
                return;
            }
            
            const response = await fetch('/api/transaction', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ from, to, amount })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showNotification(`交易已创建: ${data.txid}`);
                document.getElementById('tx-to').value = '';
                document.getElementById('tx-amount').value = '';
                refreshPendingTransactions();
            } else {
                showNotification(data.error, 'error');
            }
        }

        async function mineSingleBlock() {
            const response = await fetch('/api/mine', { method: 'POST' });
            const data = await response.json();
            
            if (data.success) {
                showNotification(`挖到区块 #${data.block.index}: ${data.block.hash}`);
                refreshBlockchain();
                refreshPendingTransactions();
                refreshWallets();
            } else {
                showNotification(data.error, 'error');
            }
        }

        async function toggleMining() {
            const isMining = document.getElementById('mining-status').classList.contains('active');
            
            if (isMining) {
                await fetch('/api/stop_mining', { method: 'POST' });
            } else {
                await fetch('/api/start_mining', { method: 'POST' });
            }
            
            refreshMiningStatus();
        }

        async function toggleNetwork() {
            const isRunning = document.getElementById('network-status').textContent === '运行中';
            const btn = document.getElementById('network-btn');
            
            if (isRunning) {
                await fetch('/api/stop_network', { method: 'POST' });
                btn.textContent = '启动网络';
                btn.className = 'btn';
            } else {
                const response = await fetch('/api/start_network', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ port: 8888 })
                });
                
                const data = await response.json();
                if (data.success) {
                    btn.textContent = '停止网络';
                    btn.className = 'btn btn-danger';
                }
            }
            
            refreshNetworkStatus();
        }

        async function connectPeer() {
            const host = document.getElementById('peer-host').value;
            const port = parseInt(document.getElementById('peer-port').value);
            
            if (!host || isNaN(port)) {
                showNotification('请填写完整信息', 'error');
                return;
            }
            
            const response = await fetch('/api/connect_peer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ host, port })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showNotification('连接成功');
                document.getElementById('peer-host').value = '';
                document.getElementById('peer-port').value = '';
                refreshNetworkStatus();
            } else {
                showNotification(data.message, 'error');
            }
        }

        function showCreateWalletModal() {
            document.getElementById('create-wallet-modal').style.display = 'flex';
        }

        function closeCreateWalletModal() {
            document.getElementById('create-wallet-modal').style.display = 'none';
            document.getElementById('wallet-name').value = '';
        }

        async function createWallet() {
            const name = document.getElementById('wallet-name').value || `钱包${Date.now()}`;
            
            const response = await fetch('/api/create_wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            
            const data = await response.json();
            
            if (data.success) {
                showNotification(`钱包 "${name}" 创建成功`);
                closeCreateWalletModal();
                refreshWallets();
            } else {
                showNotification('创建失败', 'error');
            }
        }

        // 定时刷新
        setInterval(() => {
            refreshBlockchain();
            refreshPendingTransactions();
            refreshNetworkStatus();
            refreshMiningStatus();
        }, 2000);

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            refreshBlockchain();
